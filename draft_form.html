{% extends "base.html" %}{% block title %}New draft{% endblock %}{% block content %}<section class="page-heading"><div><div class="eyebrow">CONTENT PIPELINE / NEW</div><h1>Create a draft.</h1><p>Start with the content you want to check before publication.</p></div><a class="btn btn-quiet" href="{{ url_for('dashboard') }}">← Dashboard</a></section><section class="panel editor-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-two"><label>Draft title<input name="title" required maxlength="160" placeholder="e.g. Product launch announcement"></label><label>Channel<select name="channel"><option>Social media</option><option>Website</option><option>Email campaign</option><option>Press release</option><option>Advertisement</option><option>Other</option></select></label></div><label>Draft content<textarea name="body" rows="10" required maxlength="20000" placeholder="Paste your draft here…"></textarea><small class="field-hint">Maximum 20,000 characters. Draft text is stored in this app's database.</small></label><div class="form-actions"><a class="btn btn-quiet" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary">Save draft & continue →</button></div></form></section>{% endblock %}
